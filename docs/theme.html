<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>晚霞 · 片尾主題曲</title>
<meta name="description" content="Larch 視覺小說《晚霞》的片尾主題曲 MV：畫面跟著歌走，中英對照歌詞。內含結局畫面。">
<meta name="theme-color" content="#120d16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@500;700&display=swap">
<style>:root{color-scheme:dark;--bg:#120d16;--ink:#f6efe2;--acc:#f2c46d;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--latin:"Cormorant Garamond","Noto Serif TC",Georgia,serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
/* 畫面：兩層交叉淡化，每一鏡自己的推鏡方向（JS 用 Web Animations 推） */
.film{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.film i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s ease;will-change:opacity,transform}
.film i.on{opacity:1}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,13,22,.25) 0%,rgba(18,13,22,0) 30%,rgba(18,13,22,0) 55%,rgba(18,13,22,.72) 100%)}
/* width/height 不能省：canvas 沒給 CSS 尺寸就用屬性尺寸排版，dpr 2 的手機會放大兩倍貼在左上角 */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
/* 歌詞：一次一句，英文在上、中文在下，放在下緣 */
.lyric{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(10vh,72px);height:6.2em;pointer-events:none;text-align:center}
.lyric p{position:absolute;left:0;right:0;bottom:0;margin:0;text-shadow:0 0 18px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.9);opacity:0;transform:translateY(8px);transition:opacity 1.1s ease,transform 1.1s ease}
.lyric p.on{opacity:1;transform:none}
.lyric .en{display:block;font:500 clamp(1.25rem,3vw,2.3rem)/1.3 var(--latin);letter-spacing:.02em}
.lyric .zh{display:block;margin-top:.35em;font-weight:500;font-size:clamp(.95rem,1.9vw,1.4rem);line-height:1.5;letter-spacing:.14em;color:#ffe3c9}
.prog{position:fixed;left:0;bottom:0;height:2px;width:0;background:var(--acc);opacity:.7;pointer-events:none}
.back{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:10px;display:inline-flex;align-items:center;min-height:44px;padding:0 8px;color:var(--ink);text-decoration:none;font:700 14px/1 "Noto Sans TC",system-ui,sans-serif;letter-spacing:.12em;text-shadow:0 1px 6px rgba(0,0,0,.8);opacity:.85}
.back:hover{opacity:1;color:var(--acc)}
.embed .back{display:none}
.start .k{margin:0;font:700 12px/1 "Noto Sans TC",system-ui,sans-serif;letter-spacing:.34em;color:#eaa9b6}
.black{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s ease}
.black.on{opacity:1}
.start{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(ellipse at center,rgba(18,13,22,.55),rgba(18,13,22,.92));transition:opacity .8s}
.start.gone{opacity:0;pointer-events:none}
.start .t{margin:0;font-size:clamp(1.8rem,5vw,3rem);font-weight:700;letter-spacing:.3em;text-indent:.3em}
.start .s{margin:0;font-size:.9rem;color:#b9aca0;letter-spacing:.12em}
.go{display:flex;align-items:center;gap:12px;padding:16px 34px;border-radius:999px;background:var(--acc);color:#24160b;font-size:1.25rem;font-weight:700;letter-spacing:.2em;box-shadow:0 0 40px rgba(242,196,109,.45)}
.go svg{width:26px;height:26px;fill:currentColor}
.next,.again{position:fixed;right:16px;bottom:16px;padding:10px 20px;border:1px solid rgba(242,196,109,.55);border-radius:6px;background:rgba(18,13,22,.6);color:#f6efe2;font-size:.95rem;letter-spacing:.15em;opacity:.75;transition:opacity .3s}
.next:hover,.again:hover{opacity:1}
.again{right:auto;left:50%;bottom:45vh;transform:translateX(-50%)}
.next[hidden],.again[hidden]{display:none}
.sign{position:fixed;left:16px;bottom:12px;margin:0;font-size:.75rem;color:rgba(185,172,160,.6);letter-spacing:.1em}
.embed .sign{display:none}
@media (prefers-reduced-motion:reduce){.film i,.lyric p,.black{transition:none}.lyric p{transform:none}}
</style>
</head>
<body>
<div class="film" aria-hidden="true"><i id="fA"></i><i id="fB"></i></div>
<div class="shade" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="lyric" aria-live="off"><p id="lA"></p><p id="lB"></p></div>
<div class="prog" id="prog" aria-hidden="true"></div>
<div class="black" id="black" aria-hidden="true"></div>
<div class="start" id="start">
  <p class="k">片尾主題曲</p>
  <p class="t" id="stitle">晚霞</p>
  <button type="button" id="go" class="go" aria-label="播放"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>播放</span></button>
  <p class="s" id="sub">內含結局畫面，建議玩過再看。</p>
</div>
<a class="back" href="./#ost">← 回公開站</a>
<button type="button" id="next" class="next" hidden>繼續</button>
<button type="button" id="again" class="again" hidden>再看一次</button>
<p class="sign" id="sign">晚霞 · 林亞澤</p>
<script>
const MV = {"theme": {"title": "晚霞", "dur": 167.98, "audio": "https://cdn.jsdelivr.net/gh/yazelin/larch-sunset@sunset-audio-123cffa5/assets/bgm/theme.mp3", "shots": [{"t0": 0.0, "cg": "front_night", "move": "in", "blank": true, "t1": 13.6, "img": "img/mv/front_night.webp"}, {"t0": 13.6, "cg": "rain_towel", "move": "out", "blank": false, "t1": 26.5, "img": "img/mv/rain_towel.webp"}, {"t0": 26.5, "cg": "rain_umbrella", "move": "right", "blank": false, "t1": 32.0, "img": "img/mv/rain_umbrella.webp"}, {"t0": 32.0, "cg": "rain_dawn", "move": "in", "blank": false, "t1": 39.5, "img": "img/mv/rain_dawn.webp"}, {"t0": 39.5, "cg": "dusk_recipe", "move": "out", "blank": false, "t1": 47.8, "img": "img/mv/dusk_recipe.webp"}, {"t0": 47.8, "cg": "roof_dawn", "move": "in", "blank": false, "t1": 55.4, "img": "img/mv/roof_dawn.webp"}, {"t0": 55.4, "cg": "lesson_hands", "move": "left", "blank": false, "t1": 59.4, "img": "img/mv/lesson_hands.webp"}, {"t0": 59.4, "cg": "confess_kiss", "move": "in", "blank": false, "t1": 65.3, "img": "img/mv/confess_kiss.webp"}, {"t0": 65.3, "cg": "notebook_open", "move": "in", "blank": false, "t1": 71.2, "img": "img/mv/notebook_open.webp"}, {"t0": 71.2, "cg": "notebook_august", "move": "right", "blank": false, "t1": 77.3, "img": "img/mv/notebook_august.webp"}, {"t0": 77.3, "cg": "flash_syrup", "move": "in", "blank": false, "t1": 84.4, "img": "img/mv/flash_syrup.webp"}, {"t0": 84.4, "cg": "dusk_midnight", "move": "out", "blank": false, "t1": 90.8, "img": "img/mv/dusk_midnight.webp"}, {"t0": 90.8, "cg": "open_laugh", "move": "left", "blank": false, "t1": 98.9, "img": "img/mv/open_laugh.webp"}, {"t0": 98.9, "cg": "roof_dance", "move": "in", "blank": false, "t1": 106.4, "img": "img/mv/roof_dance.webp"}, {"t0": 106.4, "cg": "together_hands", "move": "right", "blank": false, "t1": 111.0, "img": "img/mv/together_hands.webp"}, {"t0": 111.0, "cg": "winter_finger", "move": "in", "blank": false, "t1": 117.2, "img": "img/mv/winter_finger.webp"}, {"t0": 117.2, "cg": "farewell_room", "move": "in", "blank": false, "t1": 123.4, "img": "img/mv/farewell_room.webp"}, {"t0": 123.4, "cg": "door_meal", "move": "out", "blank": false, "t1": 129.6, "img": "img/mv/door_meal.webp"}, {"t0": 129.6, "cg": "sunset_gold", "move": "in", "blank": false, "t1": 135.9, "img": "img/mv/sunset_gold.webp"}, {"t0": 135.9, "cg": "sunset_meal", "move": "out", "blank": false, "t1": 142.6, "img": "img/mv/sunset_meal.webp"}, {"t0": 142.6, "cg": "evening_roof", "move": "in", "blank": false, "t1": 154.2, "img": "img/mv/evening_roof.webp"}, {"t0": 154.2, "cg": "evening_bar", "move": "out", "blank": false, "t1": 167.98, "img": "img/mv/evening_bar.webp"}], "lines": [{"t": 13.6, "en": "Tucked away inside a tiny bar", "zh": "巷子裡　躲著一間小酒吧"}, {"t": 19.0, "en": "Seven wooden stools against the dark", "zh": "七張高腳椅　排在暗暗的燈下"}, {"t": 26.5, "en": "Rain was falling in the narrow street", "zh": "那一晚　窄巷裡下著雨"}, {"t": 32.0, "en": "Whispered through the glass so soft and sweet", "zh": "雨隔著玻璃　像在輕聲細語"}, {"t": 39.5, "en": "I pour it slow, there is saffron in my glass", "zh": "我慢慢地倒　杯子裡有番紅花"}, {"t": 47.8, "en": "The sunset glows, memories that cannot pass", "zh": "晚霞亮起來　忘不掉妳說的話"}, {"t": 55.4, "en": "Hibiscus red is at the base", "zh": "洛神的紅　沉在杯底"}, {"t": 59.4, "en": "Recalling every line of your face", "zh": "想起妳的臉　一點都沒忘記"}, {"t": 65.3, "en": "She wrote everything by her own hand", "zh": "每一杯　妳都親手寫下來"}, {"t": 71.2, "en": "Flavors that her tongue could not command", "zh": "酒的味道　妳舌頭嚐不出來"}, {"t": 77.3, "en": "Take a little sip, is it sweet?", "zh": "喝一小口　妳問我甜嗎"}, {"t": 84.4, "en": "Asking me each time we would meet", "zh": "每一次見面　妳都問這句話"}, {"t": 90.8, "en": "I pour it slow, there is saffron in my glass", "zh": "我慢慢地倒　杯子裡有番紅花"}, {"t": 98.9, "en": "The sunset glows, memories that cannot pass", "zh": "晚霞亮起來　忘不掉妳說的話"}, {"t": 106.4, "en": "A layer of pink right on top", "zh": "最上面　浮著一層粉紅"}, {"t": 111.0, "en": "Hoping that this moment won't stop", "zh": "真希望時間　停在這一分鐘"}, {"t": 117.2, "en": "She told me always remember to eat", "zh": "妳跟我說　記得吃飯"}, {"t": 123.4, "en": "So I keep living on my own two feet", "zh": "所以我一個人　好好過每一天"}, {"t": 129.6, "en": "Stings for a moment when it hits my tongue", "zh": "碰到舌頭　先刺了一下"}, {"t": 135.9, "en": "But then it is sweet, just like when we were young", "zh": "然後就甜了　像剛認識妳那年"}, {"t": 142.6, "en": "It is still sweet, I whisper to you", "zh": "還是甜的　我小聲跟妳說"}, {"t": 147.8, "en": "As dusk paints the room in a dark shade of blue", "zh": "天快黑了　店裡一片深藍色"}, {"t": 154.2, "en": "The bar is still open, the light is still on", "zh": "店還開著　燈也還亮著"}, {"t": 158.7, "en": "I'm tender and grateful, though you are now gone", "zh": "妳不在了　我的心柔軟　也感激著"}]}};
/* 《晚霞》片尾主題曲 MV（照《餘燼》site/mv.js 改）。MV 由 site/build_mv.py 從 site/mv_storyboard.json 與 site/theme_lyrics.json 注入。
   網址參數：embed=1（嵌進遊戲：不顯示署名與返回連結、右下「繼續」）。
   播完或按「繼續」送 {type:'larch:mv:done', song} 給父層；載入時送 {type:'larch:mv:ready', song}。 */
const Q = new URLSearchParams(location.search);
const KEY = 'theme';
const SONG = MV[KEY];
const EMBED = Q.get('embed') === '1';
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
const lowEnd = matchMedia('(pointer:coarse)').matches || (navigator.hardwareConcurrency || 4) <= 4;
const $ = id => document.getElementById(id);
if (EMBED) document.body.classList.add('embed');
$('stitle').textContent = SONG.title;
const tell = type => { if (window.parent !== window) try { parent.postMessage({ type, song: KEY }, '*'); } catch (_) {} };
tell('larch:mv:ready');

const au = new Audio(); au.preload = 'auto'; au.src = SONG.audio;
SONG.shots.forEach(s => { const im = new Image(); im.src = s.img; });
const lines = SONG.lines;   // [{t, en, zh}]，建置時就注入，不另外抓檔

/* ── 畫面：一鏡一張，交叉淡化，推鏡方向照分鏡表 ── */
const MOVES = {
  in: ['scale(1.02)', 'scale(1.13)'], out: ['scale(1.13)', 'scale(1.02)'],
  left: ['translateX(2.5%) scale(1.09)', 'translateX(-2.5%) scale(1.09)'], right: ['translateX(-2.5%) scale(1.09)', 'translateX(2.5%) scale(1.09)'],
};
let shot = -1, front = 'fA';
function showShot(i) {
  if (i === shot) return; shot = i;
  const s = SONG.shots[i], nxt = front === 'fA' ? 'fB' : 'fA', n = $(nxt), f = $(front);
  n.style.backgroundImage = `url("${s.img}")`;
  n.getAnimations().forEach(a => a.cancel());
  if (!reduced) n.animate([{ transform: MOVES[s.move][0] }, { transform: MOVES[s.move][1] }], { duration: (s.t1 - s.t0 + 2) * 1000, easing: 'linear', fill: 'forwards' });
  else n.style.transform = 'scale(1.04)';
  n.classList.add('on'); f.classList.remove('on'); front = nxt;
  document.body.dataset.shot = s.cg;
}
/* ── 歌詞：一次一句，兩層交替淡入；留白那一鏡不上字 ── */
let lyr = -2, lfront = 'lA';
function showLine(ln) {
  const nxt = lfront === 'lA' ? 'lB' : 'lA';
  $(lfront).classList.remove('on');
  if (ln) {
    const p = $(nxt); p.textContent = '';
    const e = document.createElement('span'); e.className = 'en'; e.lang = 'en'; e.textContent = ln.en;
    const z = document.createElement('span'); z.className = 'zh'; z.textContent = ln.zh;
    p.append(e, z); p.classList.add('on'); lfront = nxt;
  }
}
function frame() {
  const t = au.currentTime;
  let i = 0; while (i + 1 < SONG.shots.length && SONG.shots[i + 1].t0 <= t) i++;
  showShot(i);
  let k = -1; while (k + 1 < lines.length && lines[k + 1].t <= t) k++;
  const blank = SONG.shots[i].blank;
  const key = blank ? -1 : k;
  if (key !== lyr) { lyr = key; showLine(key >= 0 ? lines[key] : null); }
  $('prog').style.width = (Math.min(1, t / SONG.dur) * 100).toFixed(2) + '%';
  document.body.dataset.line = key;
  if (SONG.dur - t < 3 && !au.paused) $('black').classList.add('on');
}

/* ── 氣泡：像氣泡酒，數量少、慢慢往上飄 ── */
const fx = $('fx'), g = fx.getContext('2d');
let W = 0, H = 0;
function resize() { const d = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; fx.width = Math.round(W * d); fx.height = Math.round(H * d); g.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', resize); resize();
const spr = document.createElement('canvas'); spr.width = spr.height = 32;
{ const c = spr.getContext('2d'), gr = c.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,244,222,.9)'); gr.addColorStop(.35, 'rgba(242,196,109,.45)'); gr.addColorStop(1, 'rgba(234,169,182,0)'); c.fillStyle = gr; c.fillRect(0, 0, 32, 32); }
const bits = [], MAX = lowEnd ? 10 : 22;
let prev = performance.now();
function tick(now) {
  const dt = Math.min((now - prev) / 1000, .05); prev = now;
  if (!au.paused) frame();
  if (!reduced) {
    g.clearRect(0, 0, W, H);
    const sp = au.paused ? .3 : 1;
    if (bits.length < MAX && Math.random() < dt * 2.2 * sp) bits.push({ x: Math.random() * W, y: H + 10, vy: -(18 + Math.random() * 30), s: 2 + Math.random() * 4, ph: Math.random() * 6.3, life: 9 + Math.random() * 5, age: 0 });
    g.globalCompositeOperation = 'lighter';
    for (let i = bits.length - 1; i >= 0; i--) {
      const p = bits[i]; p.age += dt * sp; p.ph += dt * sp;
      if (p.age > p.life || p.y < -20) { bits.splice(i, 1); continue; }
      p.y += p.vy * dt * sp; p.x += Math.sin(p.ph) * 10 * dt * sp;
      g.globalAlpha = .38 * Math.min(1, p.age / .8) * Math.min(1, (p.life - p.age) / 1.5);
      const s = p.s * 2.4; g.drawImage(spr, p.x - s / 2, p.y - s / 2, s, s);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
showShot(0);

/* ── 播放、繼續、結束 ── */
let done = false;
function finish() { if (done) return; done = true; tell('larch:mv:done'); if (!EMBED) $('again').hidden = false; }
$('go').onclick = () => {
  au.play().then(() => { $('start').classList.add('gone'); if (EMBED) $('next').hidden = false; }).catch(() => { $('sub').textContent = '音樂載入不了，請再按一次'; });
};
$('next').onclick = () => { au.pause(); finish(); };
$('again').onclick = () => { done = false; $('again').hidden = true; $('black').classList.remove('on'); au.currentTime = 0; shot = -1; lyr = -2; au.play(); };
au.onended = () => { $('black').classList.add('on'); finish(); };
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if ($('start').classList.contains('gone')) { au.paused ? au.play() : au.pause(); } else $('go').click(); }
  else if (['Backspace', 'BrowserBack'].includes(e.key) || (e.altKey && e.key.startsWith('Arrow'))) e.preventDefault();   // 按鍵不能把畫面帶離這頁
});

</script>
</body>
</html>
