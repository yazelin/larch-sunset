<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>晚霞 · 片尾主題曲</title>
<meta name="description" content="Larch 視覺小說《晚霞》的片尾主題曲 MV：畫面跟著歌走，中英對照歌詞。內含結局畫面。">
<meta name="theme-color" content="#120d16">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>:root{color-scheme:dark;--bg:#120d16;--ink:#f6efe2;--acc:#f2c46d;--rose:#eaa9b6;--pour:0;--amp:0;--bar:0px;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;--latin:"Cormorant Garamond","Noto Serif TC",Georgia,serif;--hand:"LXGW WenKai TC","Noto Serif TC","Kaiti TC",serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--serif);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
@media (min-aspect-ratio:3/2){:root{--bar:6.5vh}}
/* 畫面：兩層交叉淡化，每一鏡自己的推鏡方向（JS 用 Web Animations 推）；換鏡時帶一點柔焦 */
.film{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.film i{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;filter:blur(7px) brightness(1.12);transition:opacity 2.2s ease,filter 2.6s ease;will-change:opacity,transform}
.film i.on{opacity:1;filter:none}
/* 色調：回憶的畫面邊緣一圈暖白柔邊（跟遊戲裡的回憶效果同一個做法），頭七那晚偏冷 */
.tone{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 2.4s ease}
.tone.warm{box-shadow:inset 0 0 16vw 2vw rgba(255,238,212,.3);background:radial-gradient(ellipse at 50% 42%,rgba(255,226,180,.06),rgba(255,226,180,0) 60%)}
.tone.cold{background:linear-gradient(180deg,rgba(40,58,96,.2),rgba(18,20,40,.3))}
[data-tone="warm"] .tone.warm,[data-tone="cold"] .tone.cold{opacity:1}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(18,13,22,.3) 0%,rgba(18,13,22,0) 26%,rgba(18,13,22,0) 50%,rgba(18,13,22,.78) 100%)}
/* 副歌的「倒酒」：紅、金、粉紅三層光從畫面底部疊上來，高度跟著 --pour */
.wash{position:fixed;left:0;right:0;bottom:0;height:62vh;pointer-events:none;mix-blend-mode:screen;opacity:calc(var(--pour)*.85);
  transform-origin:50% 100%;transform:scaleY(calc(.25 + var(--pour)*.75));
  background:linear-gradient(0deg,rgba(176,36,63,.62) 0%,rgba(176,36,63,.4) 22%,rgba(232,170,70,.36) 44%,rgba(240,189,92,.26) 58%,rgba(244,166,180,.24) 76%,rgba(244,166,180,0) 100%);
  -webkit-mask-image:linear-gradient(0deg,#000 0,#000 55%,transparent 100%);mask-image:linear-gradient(0deg,#000 0,#000 55%,transparent 100%)}
/* 跟著音量呼吸的暖光 */
.glow{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:calc(.05 + var(--amp)*.42);
  background:radial-gradient(ellipse 70% 46% at 50% 100%,rgba(242,196,109,.5),rgba(242,196,109,0) 70%)}
/* width/height 不能省：canvas 沒給 CSS 尺寸就用屬性尺寸排版，dpr 2 的手機會放大兩倍貼在左上角 */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.grain{position:fixed;inset:-60%;pointer-events:none;opacity:.075;mix-blend-mode:overlay;background-size:160px 160px;animation:grain .9s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}17%{transform:translate(-4%,3%)}34%{transform:translate(3%,-5%)}51%{transform:translate(-6%,-2%)}68%{transform:translate(5%,4%)}85%{transform:translate(-2%,6%)}100%{transform:translate(0,0)}}
/* 寬螢幕上下各一條黑邊 */
.bars::before,.bars::after{content:"";position:fixed;left:0;right:0;height:var(--bar);background:#07050a;pointer-events:none}
.bars::before{top:0}.bars::after{bottom:0}
/* 前奏的片名 */
.intro{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:1.1vh;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity 2.4s ease,transform 3s ease;text-shadow:0 0 24px rgba(0,0,0,.85)}
.intro-on .intro{opacity:1;transform:none}
.intro small{font:700 clamp(10px,1vw,14px)/1 "Noto Sans TC",system-ui,sans-serif;letter-spacing:.5em;text-indent:.5em;color:var(--rose)}
.intro b{font:900 clamp(3rem,9vw,7.5rem)/1.15 var(--serif);letter-spacing:.22em;text-indent:.22em;text-shadow:0 0 50px rgba(242,196,109,.45),0 0 24px rgba(0,0,0,.8)}
.intro i{display:block;width:clamp(120px,16vw,240px);height:3px;background:linear-gradient(90deg,#b3243f 0 33.3%,#dba53f 33.3% 66.6%,#eaa9b6 66.6%)}
.intro span{font:500 clamp(.85rem,1.5vw,1.25rem)/1.6 var(--hand);letter-spacing:.3em;text-indent:.3em;color:#ffe3c9}
/* 歌詞：一次一句，放在下緣。英文照唱到的字一個一個浮出來，中文用手寫感的字跟著分段出現 */
.lyric{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--bar) + max(5.5vh,40px));height:7em;pointer-events:none;text-align:center}
.lyric p{position:absolute;left:0;right:0;bottom:0;margin:0;text-shadow:0 0 18px rgba(0,0,0,.92),0 1px 3px rgba(0,0,0,.9);opacity:0;transition:opacity 1.2s ease}
.lyric p.on{opacity:1}
.lyric .en{display:block;font:500 clamp(1.3rem,3.1vw,2.6rem)/1.28 var(--latin);letter-spacing:.02em}
.lyric .zh{display:block;margin-top:.4em;font:400 clamp(1rem,2.1vw,1.7rem)/1.5 var(--hand);letter-spacing:.16em;color:#ffe3c9}
.lyric .w,.lyric .z{display:inline-block;opacity:0;transform:translateY(.4em);filter:blur(5px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1),filter .9s ease}
.lyric .z{white-space:pre;transition-duration:1.1s,1.3s,1.3s}
.lyric .w.lit,.lyric .z.lit{opacity:1;transform:none;filter:none}
.lyric p.chorus .en{font-size:clamp(1.45rem,3.5vw,3rem);text-shadow:0 0 26px rgba(242,196,109,.5),0 0 18px rgba(0,0,0,.9),0 1px 3px rgba(0,0,0,.9)}
.lyric p.key .zh{color:var(--acc);font-size:clamp(1.15rem,2.5vw,2.05rem);text-shadow:0 0 22px rgba(242,196,109,.55),0 0 18px rgba(0,0,0,.92)}
.prog{position:fixed;left:0;bottom:0;height:2px;width:0;background:var(--acc);opacity:.7;pointer-events:none}
.black{position:fixed;inset:0;background:#07050a;opacity:0;pointer-events:none;transition:opacity 2.6s ease}
.black.on{opacity:1}
/* 結尾：黑幕上浮出她最後那句話 */
.endcard{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:2.4vh;pointer-events:none;opacity:0;transition:opacity 2.8s ease 1.6s}
.end-on .endcard{opacity:1}
.endcard b{font:400 clamp(1.8rem,5vw,3.6rem)/1.3 var(--hand);letter-spacing:.3em;text-indent:.3em;color:#ffe3c9;text-shadow:0 0 30px rgba(242,196,109,.35)}
.endcard i{display:block;width:clamp(90px,10vw,150px);height:2px;background:linear-gradient(90deg,#b3243f 0 33.3%,#dba53f 33.3% 66.6%,#eaa9b6 66.6%)}
.endcard span{font:500 clamp(.8rem,1.3vw,1.05rem)/1.6 var(--serif);letter-spacing:.34em;text-indent:.34em;color:#b9aca0}
.start{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;background:radial-gradient(ellipse at center,rgba(18,13,22,.55),rgba(18,13,22,.92));transition:opacity .8s}
.start.gone{opacity:0;pointer-events:none}
.start .k{margin:0;font:700 12px/1 "Noto Sans TC",system-ui,sans-serif;letter-spacing:.34em;color:var(--rose)}
.start .t{margin:0;font-size:clamp(1.8rem,5vw,3rem);font-weight:700;letter-spacing:.3em;text-indent:.3em}
.start .s{margin:0;font-size:.9rem;color:#b9aca0;letter-spacing:.12em}
.go{display:flex;align-items:center;gap:12px;padding:16px 34px;border-radius:999px;background:var(--acc);color:#24160b;font-size:1.25rem;font-weight:700;letter-spacing:.2em;box-shadow:0 0 40px rgba(242,196,109,.45)}
.go svg{width:26px;height:26px;fill:currentColor}
.next,.again{position:fixed;right:16px;bottom:calc(var(--bar) + 16px);padding:10px 20px;border:1px solid rgba(242,196,109,.55);border-radius:6px;background:rgba(18,13,22,.6);color:#f6efe2;font-size:.95rem;letter-spacing:.15em;opacity:.75;transition:opacity .3s}
.next:hover,.again:hover{opacity:1}
.again{right:auto;left:50%;bottom:22vh;transform:translateX(-50%)}
.next[hidden],.again[hidden]{display:none}
.back{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(var(--bar) + 6px);display:inline-flex;align-items:center;min-height:44px;padding:0 8px;color:var(--ink);text-decoration:none;font:700 14px/1 "Noto Sans TC",system-ui,sans-serif;letter-spacing:.12em;text-shadow:0 1px 6px rgba(0,0,0,.8);opacity:.85}
.back:hover{opacity:1;color:var(--acc)}
.sign{position:fixed;left:16px;bottom:calc(var(--bar) + 10px);margin:0;font-size:.75rem;color:rgba(185,172,160,.6);letter-spacing:.1em}
.embed .sign,.embed .back,.rec .sign,.rec .back,.rec .prog,.rec .start,.rec .next,.rec .again{display:none}
@media (prefers-reduced-motion:reduce){.film i,.lyric p,.black,.tone,.intro,.endcard{transition:none}.film i{filter:none}.lyric .w,.lyric .z{transition:none;transform:none;filter:none}.grain{animation:none}.intro{transform:none}}
/* 錄影（1920×1080）：字放大一級，影片縮小看也讀得到 */
.rec .lyric{height:9em}
.rec .lyric .en{font-size:60px}.rec .lyric .zh{font-size:40px}
.rec .lyric p.chorus .en{font-size:68px}.rec .lyric p.key .zh{font-size:48px}
.rec .intro b{font-size:170px}.rec .intro small{font-size:18px}.rec .intro span{font-size:30px}.rec .intro i{width:300px;height:4px}
.rec .endcard b{font-size:84px}.rec .endcard span{font-size:24px}.rec .endcard i{width:180px;height:3px}
</style>
</head>

  n.getAnimations().forEach(a => a.cancel());
  if (!reduced) n.animate([{ transform: MOVES[s.move][0] }, { transform: MOVES[s.move][1] }], { duration: (s.t1 - s.t0 + 3) * 1000, easing: 'linear', fill: 'forwards' });
  else n.style.transform = 'scale(1.04)';
  n.classList.add('on'); f.classList.remove('on'); front = nxt;
  document.body.dataset.shot = s.cg; document.body.dataset.tone = s.tone;
}

/* ── 歌詞：一次一句。英文照唱到的字一個一個浮出來，中文跟著分段出現 ── */
let lyr = -2, lfront = 'lA', curWords = [];
function span(cls, text, t) { const e = document.createElement('span'); e.className = cls; e.textContent = text; e._t = t; return e; }
function showLine(k) {
  const nxt = lfront === 'lA' ? 'lB' : 'lA';
  $(lfront).classList.remove('on'); curWords = [];
  if (k < 0) return;
  const ln = lines[k], p = $(nxt); p.textContent = ''; p.className = (ln.key ? 'key ' : '') + ln.sec;
  const e = document.createElement('span'); e.className = 'en'; e.lang = 'en';
  ln.w.forEach((w, i) => { const s = span('w', w[0], w[1]); e.append(s); if (i < ln.w.length - 1) e.append(' '); curWords.push(s); });
  const z = document.createElement('span'); z.className = 'zh';
  ln.z.forEach(g => { const s = span('z', g[0], g[1]); z.append(s); curWords.push(s); });
  p.append(e, z); p.classList.add('on'); lfront = nxt;
}
let pour = 0, amp = 0;
function frame(dt) {
  const t = au.currentTime;
  let i = 0; while (i + 1 < SONG.shots.length && SONG.shots[i + 1].t0 <= t) i++;
  showShot(i);
  let k = -1; while (k + 1 < lines.length && lines[k + 1].t <= t) k++;
  if (k === lines.length - 1 && t > SONG.fade) k = -1;          // 最後一句唱完，字跟著畫面一起暗下去
  const key = SONG.shots[i].blank ? -1 : k;
  if (key !== lyr) { lyr = key; showLine(key); }
  for (const s of curWords) if (!s._on && t >= s._t) { s._on = true; s.classList.add('lit'); }
  document.body.dataset.line = key;
  document.body.classList.toggle('intro-on', t > 1.4 && t < SONG.shots[1].t0 - 2.2);
  /* 副歌：畫面底部像倒酒，紅、金、粉紅一層一層疊上來；副歌結束慢慢退掉 */
  const chorus = key >= 0 && lines[key].sec === 'chorus';
  const target = chorus ? Math.min(1, (t - lines[key - lines[key].nth].t) / 7 + .12) : 0;
  pour += (target - pour) * Math.min(1, dt * (target > pour ? 1.6 : .7));
  root.style.setProperty('--pour', pour.toFixed(3));
  const e = ENV[Math.min(ENV.length - 1, Math.max(0, Math.floor(t * SONG.hz)))] || 0;
  amp += (e - amp) * Math.min(1, dt * 6);
  root.style.setProperty('--amp', amp.toFixed(3));
  $('prog').style.width = (Math.min(1, t / SONG.dur) * 100).toFixed(2) + '%';
  if (t >= SONG.fade && !au.paused) { $('black').classList.add('on'); document.body.classList.add('end-on'); }
}

/* ── 顆粒：一張雜訊圖鋪滿，位置跳動 ── */
{ const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d'), d = x.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = 90 + Math.random() * 165; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); $('grain').style.backgroundImage = `url(${c.toDataURL()})`; }

/* ── 雨絲與氣泡：雨夜那幾鏡下雨，其他時候是氣泡酒的氣泡，跟著音量多一點、亮一點 ── */
const fx = $('fx'), g = fx.getContext('2d');
let W = 0, H = 0;
function resize() { const d = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; fx.width = Math.round(W * d); fx.height = Math.round(H * d); g.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', resize); resize();
const spr = document.createElement('canvas'); spr.width = spr.height = 32;
{ const c = spr.getContext('2d'), gr = c.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,244,222,.95)'); gr.addColorStop(.35, 'rgba(242,196,109,.45)'); gr.addColorStop(1, 'rgba(234,169,182,0)'); c.fillStyle = gr; c.fillRect(0, 0, 32, 32); }
const bits = [], drops = [], MAXB = lowEnd ? 14 : 34, MAXD = lowEnd ? 40 : 110;
let prev = performance.now(), rainLv = 0;
function tick(now) {
  const dt = Math.min((now - prev) / 1000, .05); prev = now;
  if (!au.paused) frame(dt);
  if (!reduced) {
    g.clearRect(0, 0, W, H);
    const sp = au.paused ? .3 : 1, s0 = SONG.shots[Math.max(0, shot)];
    rainLv += ((s0 && s0.rain ? 1 : 0) - rainLv) * Math.min(1, dt * .8);
    /* 雨 */
    if (rainLv > .02) {
      while (drops.length < MAXD * rainLv) drops.push({ x: Math.random() * (W + 200) - 100, y: Math.random() * H, l: 14 + Math.random() * 26, v: 900 + Math.random() * 700, a: .05 + Math.random() * .13 });
      g.lineWidth = 1; g.lineCap = 'round';
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i]; d.y += d.v * dt * sp; d.x -= d.v * .16 * dt * sp;
        if (d.y > H + 30) { if (drops.length > MAXD * rainLv) { drops.splice(i, 1); continue; } d.y = -30; d.x = Math.random() * (W + 200) - 60; }
        g.strokeStyle = `rgba(200,215,240,${(d.a * rainLv).toFixed(3)})`; g.beginPath(); g.moveTo(d.x, d.y); g.lineTo(d.x + d.l * .16, d.y - d.l); g.stroke();
      }
    } else drops.length = 0;
    /* 氣泡 */
    const lv = (1 - rainLv) * (.45 + amp * 1.1);
    if (bits.length < MAXB && Math.random() < dt * 3.4 * sp * lv) bits.push({ x: Math.random() * W, y: H + 10, vy: -(22 + Math.random() * 38), s: 1.6 + Math.random() * 4.2, ph: Math.random() * 6.3, life: 8 + Math.random() * 6, age: 0 });
    g.globalCompositeOperation = 'lighter';
    for (let i = bits.length - 1; i >= 0; i--) {
      const p = bits[i]; p.age += dt * sp; p.ph += dt * sp;
      if (p.age > p.life || p.y < -20) { bits.splice(i, 1); continue; }
      p.y += p.vy * dt * sp; p.x += Math.sin(p.ph) * 9 * dt * sp;
      g.globalAlpha = (.3 + amp * .35) * Math.min(1, p.age / .8) * Math.min(1, (p.life - p.age) / 1.5) * (1 - rainLv * .8);
      const s = p.s * 2.4; g.drawImage(spr, p.x - s / 2, p.y - s / 2, s, s);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
showShot(0);

/* ── 播放、繼續、結束 ── */
let done = false;
function finish() { if (done) return; done = true; tell('larch:mv:done'); if (!EMBED && !REC) $('again').hidden = false; }
$('go').onclick = () => {
  au.play().then(() => { $('start').classList.add('gone'); if (EMBED) $('next').hidden = false; }).catch(() => { $('sub').textContent = '音樂載入不了，請再按一次'; });
};
$('next').onclick = () => { au.pause(); finish(); };
$('again').onclick = () => { done = false; $('again').hidden = true; $('black').classList.remove('on'); document.body.classList.remove('end-on'); au.currentTime = 0; shot = -1; lyr = -2; pour = 0; au.play(); };
au.onended = () => { $('black').classList.add('on'); document.body.classList.add('end-on'); finish(); };
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); if ($('start').classList.contains('gone')) { au.paused ? au.play() : au.pause(); } else $('go').click(); }
  else if (['Backspace', 'BrowserBack'].includes(e.key) || (e.altKey && e.key.startsWith('Arrow'))) e.preventDefault();   // 按鍵不能把畫面帶離這頁
});

</script>
</body>
</html>
