<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* 舞台：視窗中央那塊 16:9（播放器用 contain 放 CG 的位置）。標示與柔邊都對齊它，尺寸跟著它的寬度走 */
  .stage { position: fixed; left: 50%; top: 50%; width: min(100vw, 177.78vh); aspect-ratio: 16 / 9; transform: translate(-50%, -50%); container-type: inline-size; }
  /* 回憶：CG 邊緣一圈暖白柔邊（往內暈、往外也淡出，不留硬邊），上緣再亮一點；下緣是對話框所以不加 */
  .fx { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease;
    box-shadow: inset 0 0 9cqw 1.2cqw rgba(255, 238, 212, .4), 0 0 5cqw 1cqw rgba(255, 238, 212, .22);
    background: linear-gradient(to bottom, rgba(255, 238, 212, .2), rgba(255, 238, 212, 0) 14%); }
  .fx.on { opacity: 1; }
  .when { position: absolute; left: 2.25cqw; top: 2.1cqw; font-size: clamp(10px, 1.6cqw, 28px); }
  .when { display: inline-flex; align-items: center; gap: .62em; height: 2.9em; padding: 0 .8em; box-sizing: border-box; border-radius: .25em;
    background: rgba(14, 10, 20, .68); color: #f6efe2; white-space: nowrap; opacity: 0; transition: opacity .5s ease;
    font-family: "Noto Serif TC", "Noto Serif CJK TC", "Source Han Serif TC", "Songti TC", PMingLiU, serif; }
  .when.on { opacity: 1; }
  .bar { width: .3em; height: 2em; background: linear-gradient(to top, #b3243f 0 33.3%, #dba53f 33.3% 66.6%, #eaa9b6 66.6%); }
  .mode { font-size: 1em; font-weight: 600; }
  .mode[data-m="回憶"] { color: #f1d9a6; }
  .mode[data-m="現在"] { color: #c6d6ec; }
  .main { font-size: 1.54em; font-weight: 600; }
  .sub { font-size: 1em; color: #d6ccbe; margin-left: .2em; }
  .mode:empty, .sub:empty { display: none; }
  @media (prefers-reduced-motion: reduce) { .when, .fx { transition-duration: .01ms; } }
</style></head>
<body><div class="stage"><div class="fx" id="fx"></div>
<div class="when" id="w"><span class="bar"></span><span class="mode" id="m"></span><span class="main" id="a"></span><span class="sub" id="s"></span></div></div>
<script>
  var WHEN = /*WHEN*/{}/*END*/, now = '', timer = 0;
  var fx = document.getElementById('fx'), w = document.getElementById('w'), m = document.getElementById('m'), a = document.getElementById('a'), s = document.getElementById('s');
  function fill(v) { m.textContent = v[0]; m.dataset.m = v[0]; a.textContent = v[1]; s.textContent = v[2]; w.classList.add('on'); }
  function show(id) {
    var v = WHEN[id];
    fx.classList.toggle('on', !!v && v[0] === '回憶');
    var key = v ? v.join('|') : '';
    if (key === now) return;
    now = key; clearTimeout(timer);
    if (!w.classList.contains('on')) { if (v) fill(v); return; }
    w.classList.remove('on');
    if (v) timer = setTimeout(function () { fill(v); }, 350);
  }
  addEventListener('message', function (e) {
    if (e.source !== parent) return;
    var d = e.data;
    if (d && (d.type === 'larch:hud:init' || d.type === 'larch:hud:update')) show(d.cardId);
  });
  parent.postMessage({ type: 'larch:ready' }, '*');
</script></body></html>
