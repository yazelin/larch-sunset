# 深夜吧檯（m-bar）高解析度手繪動漫分層設計
# 遵循《正式地圖開工前：先用色塊確認 RPG 的遮擋層次》規範。
# 依據原作原畫「THE AMBER GROTTO」完整還原：
# 經典水平實木吧檯＋高腳椅＋左側翻板通道、北牆大琥珀酒櫃、右側皮革沙發卡座雅座區、中央深紅金邊地毯。
# 單位：細格（48px）。

map: {id: m-bar, w: 20, h: 12}

ground:
  - {name: 西牆實體邊界, kind: border, rects: [[0, 0, 2, 12]]}
  - {name: 東牆實體邊界, kind: border, rects: [[18, 0, 2, 12]]}
  - {name: 南牆實體邊界, kind: border, rects: [[0, 11, 20, 1], [0, 10, 8, 1], [12, 10, 8, 1]]}
  - {name: 北牆實體邊界與酒櫃, kind: border, rects: [[0, 0, 2, 2], [4, 0, 3, 2], [7, 0, 6, 3], [13, 0, 3, 2], [18, 0, 2, 2]]}
  - {name: 東側雅座沙發, kind: border, rects: [[16, 3, 2, 8]]}

objects:
  # ── 經典水平胡桃木吧檯長桌（含外側高腳椅、檯面黃銅包邊、左側掀開翻板通道） ──
  # 圖框：從 x=6, y=3 開始，寬 8 格、高 4 格（384x192 px）。
  # 排序列：sort = 5。調酒師站在 y=3 工作席位時會被吧檯遮擋下半身、露出上半身；顧客站在 y>=6 時畫在最上方。
  # 佔地擋路：吧檯立面與高腳椅區域 [7, 4, 7, 2]。
  # 可走通道：左側翻板通道 [6, 3], [6, 4], [6, 5] 與吧檯後方調酒師席位 [7, 3]..[12, 3]。
  - {name: 中央吧檯桌, kind: 吧檯, foot: [7, 4, 7, 2], frame: [6, 3, 8, 4], sort: 5, desc: 經典水平深色胡桃木吧檯，附黃銅腳踏軌與吧檯高腳椅，左側翻板通道掀開可通行}

points:
  hero_start: [10, 7]
  interact_note: [8, 6]
  interact_spoon: [11, 6]
  interact_shaker: [9, 3]
  door_storage: [3, 1]
  door_bedroom: [17, 1]
  bartender_spot: [9, 3]
